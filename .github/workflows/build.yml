name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: 'false'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Sign release build (CI-generated test keystore)
        id: release
        continue-on-error: true
        env:
          KS_PASS: paimonfooddiary
        run: |
          keytool -genkeypair -v -keystore release.keystore \
            -alias paimon -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -dname "CN=Paimon Food Diary, OU=Teyvat, O=Paimon, L=Mondstadt, S=Mondstadt, C=EI"
          gradle --no-daemon assembleRelease \
            -PreleaseKeystore="$GITHUB_WORKSPACE/release.keystore" \
            -PreleaseKeystorePassword="$KS_PASS" \
            -PreleaseKeyAlias=paimon \
            -PreleaseKeyPassword="$KS_PASS"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PaimonFoodDiary-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release APK
        if: ${{ steps.release.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: PaimonFoodDiary-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore

      - name: Summary
        run: |
          echo "## 派蒙的编译报告" >> "$GITHUB_STEP_SUMMARY"
          find app/build/outputs/apk -name "*.apk" -printf '- %p (%s bytes)\n' >> "$GITHUB_STEP_SUMMARY" || true
